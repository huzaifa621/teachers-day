# Drop this in as /etc/nginx/sites-available/teachers-day, symlink into
# sites-enabled, then run: sudo certbot --nginx -d tributes.yourdomain.com
# Certbot rewrites this file to add the 443/ssl_certificate block and an
# http->https redirect — don't hand-write the TLS block yourself.

server {
    listen 80;
    server_name tributes.yourdomain.com;

    # Default is 1MB — multer allows video uploads up to 200MB (see
    # backend/src/routes/submissions.js), so without this every video
    # submission gets rejected by Nginx with a 413 before it even reaches
    # the backend.
    client_max_body_size 200M;

    # Headroom for a large video upload over a slow connection, and for
    # uncached GIF generation (ffmpeg compositing, a few seconds).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;

    location /api/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
