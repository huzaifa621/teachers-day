# Drop this in as /etc/nginx/sites-available/teachers-day, symlink into
# sites-enabled, then run: sudo certbot --nginx -d tributes.yourdomain.com
# Certbot rewrites this file to add the 443/ssl_certificate block and an
# http->https redirect — don't hand-write the TLS block yourself.

server {
    listen 80;
    server_name tributes.yourdomain.com;

    # Uploads go browser -> S3 directly via presigned PUT (see
    # backend/src/routes/uploads.js), so request bodies reaching the backend
    # are just small JSON now. Default is 1MB; this is plain headroom.
    client_max_body_size 25M;

    # Headroom for uncached GIF generation, which pulls the video back down
    # from S3 and composites it with ffmpeg (a few seconds).
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    client_body_timeout 300s;

    location /api/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
